<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT｜AI 工具小抄</title>
  <meta name="description" content="ChatGPT 的用途、入門步驟與注意事項。">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-tool="chatgpt" style="--tool:#1f7a63">
  <main class="sheet">
    <header>
      <h1>ChatGPT</h1>
      <p class="lead">透過對話協助學習、寫作與整理想法。</p>
    </header>
    <section>
      <h2>適合用來</h2>
      <ul>
        <li>解釋不熟悉的概念與專有名詞。</li>
        <li>整理筆記與文章大綱。</li>
        <li>協助修改文字並提供寫作建議。</li>
      </ul>
    </section>
    <section>
      <h2>三步上手</h2>
      <ol>
        <li>開啟 ChatGPT 官方網站。</li>
        <li>輸入問題，並說明你想得到的答案形式。</li>
        <li>閱讀回覆，提出追問並核對重要資訊。</li>
      </ol>
    </section>
    <section>
      <h2>範例提示詞</h2>
      <pre class="prompt">請用大學生能理解的方式，解釋[主題]，並提供一個生活中的例子。</pre>
    </section>
    <section>
      <h2>注意事項</h2>
      <ul>
        <li>AI 可能提供錯誤資訊，重要內容需要查證。</li>
        <li>不要輸入密碼或其他敏感個人資料。</li>
        <li>使用 AI 協助作業時，遵守課程規定。</li>
      </ul>
    </section>
    <footer>
      <a href="../index.html">回到所有小抄</a>
    </footer>
  </main>
</body>
</html>
