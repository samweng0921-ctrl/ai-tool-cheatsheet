<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude｜AI 工具小抄</title>
  <meta name="description" content="Claude 的用途、入門步驟與注意事項。">
  <link rel="stylesheet" href="../style.css">
</head>
<body data-tool="claude" style="--tool:#a65b2b">
  <main class="sheet">
    <header>
      <h1>Claude</h1>
      <p class="lead">協助閱讀、寫作、分析與程式開發。</p>
    </header>
    <section>
      <h2>適合用來</h2>
      <ul>
        <li>整理文章重點與比較不同觀點。</li>
        <li>修改報告內容與調整文章結構。</li>
        <li>協助理解程式碼與排查錯誤。</li>
      </ul>
    </section>
    <section>
      <h2>三步上手</h2>
      <ol>
        <li>開啟 Claude 官方網站。</li>
        <li>輸入任務與需要遵守的條件。</li>
        <li>檢查產出結果，要求修改不足的部分。</li>
      </ol>
    </section>
    <section>
      <h2>範例提示詞</h2>
      <pre class="prompt">請閱讀以下[文章內容]，整理三個主要論點，並指出可能需要補充證據的地方。</pre>
    </section>
    <section>
      <h2>注意事項</h2>
      <ul>
        <li>AI 的分析與摘要可能有遺漏，應對照原文。</li>
        <li>避免提供未經授權的私人或機密資料。</li>
        <li>功能與使用限制請以官方網站為準。</li>
      </ul>
    </section>
    <footer>
      <a href="../index.html">回到所有小抄</a>
    </footer>
  </main>
</body>
</html>
